[mod-name]
functional-gleba-map-colors=Functional Gleba Map Colors

[mod-description]
functional-gleba-map-colors=Adjusts map colors of Gleba terrain to represent function rather than appearance, making farmable land easier to distinguish from unfarmable land and water.

[mod-setting-name]
functional-gleba-map-colors-agricultural-stage=Agricultural stage
functional-gleba-map-colors-agricultural-stage-contrast=Agricultural stage contrast
functional-gleba-map-colors-high-fertility-yumako-color=High fertility yumako color
functional-gleba-map-colors-low-fertility-yumako-color=Low fertility yumako color
functional-gleba-map-colors-artificial-yumako-color=Artificial yumako color
functional-gleba-map-colors-high-fertility-jellynut-color=High fertility jellynut color
functional-gleba-map-colors-low-fertility-jellynut-color=Low fertility jellynut color
functional-gleba-map-colors-artificial-jellynut-color=Artificial jellynut color
functional-gleba-map-colors-highland-color=Highland color
functional-gleba-map-colors-midland-color=Midland color
functional-gleba-map-colors-lowland-color=Lowland color
functional-gleba-map-colors-shallow-water-color=Shallow water color
functional-gleba-map-colors-deep-water-color=Deep water color
