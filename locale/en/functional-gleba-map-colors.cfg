[mod-setting-description]
functional-gleba-map-colors-agricultural-stage=Separates farmable ground on Gleba into two categories based on whether it can be farmed with a particular level of artificial soil, and increases the contrast between these two categories.
functional-gleba-map-colors-agricultural-stage-contrast=Determines the strength of the contrast between usable and unusable ground. Higher contrast between these two categories implies lower contrast within the each. This setting has no effect if the agricultural stage setting is unspecified.
functional-gleba-map-colors-high-fertility-yumako-color=The map color used for ground that supports farming yumako without the need of any artificial soil.
functional-gleba-map-colors-low-fertility-yumako-color=The map color used for ground that requires overgrowth soil in order to support farming yumako.
functional-gleba-map-colors-artificial-yumako-color=The map color of artificial or overgrowth soil already in place for farming yumako.
functional-gleba-map-colors-high-fertility-jellynut-color=The map color used for ground that supports farming jellynut without the need of any artificial soil.
functional-gleba-map-colors-low-fertility-jellynut-color=The map color used for ground that requires overgrowth soil in order to support farming jellynut.
functional-gleba-map-colors-artificial-jellynut-color=The map color of artificial or overgrowth soil already in place for farming jellynut.
functional-gleba-map-colors-highland-color=The map color used for high elevation ground.
functional-gleba-map-colors-midland-color=The map color used for middle elevation ground.
functional-gleba-map-colors-lowland-color=The map color used for low elevation ground.
functional-gleba-map-colors-shallow-water-color=The map color used for shallow water that can be walked on but requires landfill for building on.
functional-gleba-map-colors-deep-water-color=The map color used for deep water that requires landfill for walking or building on.
functional-gleba-map-colors-other-color=The map color used for any other natural ground found on Gleba that does not fit into the above categories.
functional-gleba-map-colors-adjust-water-contrast=Enables alteration of the lightness values between farmable and unfarmable wetlands and deep water.
functional-gleba-map-colors-fertile-water-lightness=The minimum lightness level of wetland tiles that are farmable with artificial or overgrowth soil.
functional-gleba-map-colors-shallow-water-lightness=The lightness level of wetland tiles that are never farmable.
functional-gleba-map-colors-deep-water-lightness=The lightness level of deep water tiles.

