[string-mod-setting-description]
functional-gleba-map-colors-agricultural-stage-unspecified=Contrast is moderate between all levels of ground farmability.
functional-gleba-map-colors-agricultural-stage-natural=Naturally farmable ground is contrasted more against ground that is farmable only with artificial or overgrowth soil.
functional-gleba-map-colors-agricultural-stage-artificial=Naturally farmable ground and ground which is farmable with artificial soil are contrasted more against ground that is farmable only with overgrowth soil.
functional-gleba-map-colors-agricultural-stage-overgrowth=All farmable ground is contrasted more against ground and water that is never farmable.
functional-gleba-map-colors-agricultural-stage-contrast-very-high=Very significant contrast between farmable and unfarmable ground.
functional-gleba-map-colors-agricultural-stage-contrast-high=Significant contrast between farmable and unfarmable ground.
functional-gleba-map-colors-agricultural-stage-contrast-moderate=Moderate contrast between farmable and unfarmable ground.
functional-gleba-map-colors-agricultural-stage-contrast-low=Mild contrast between farmable and unfarmable ground.
functional-gleba-map-colors-agricultural-stage-contrast-very-low=Very mild contrast between farmable and unfarmable ground.

